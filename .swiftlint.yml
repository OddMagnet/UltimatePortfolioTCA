# ── Paths ──────────────────────────────────────────────────────────────────────
included:
  - UltimatePortfolioTCA
  - UltimatePortfolioTCATests

excluded:
  - .build
  - DerivedData
  - .swiftpm

# ══════════════════════════════════════════════════════════════════════════════
# DEFAULT RULES — disabled (SwiftFormat handles these, or conflicts with project)
# ══════════════════════════════════════════════════════════════════════════════
disabled_rules:

  # ── Style rules (SwiftFormat owns all formatting) ────────────────────────
  - attribute_name_spacing           # SwiftFormat: spaceAroundOperators
  - closing_brace                    # SwiftFormat: braces
  - closure_parameter_position       # SwiftFormat: wrapArguments
  - colon                            # SwiftFormat: spaceAroundOperators
  - comma                            # SwiftFormat: spaceAroundOperators
  - computed_accessors_order         # SwiftFormat: modifierOrder
  - control_statement                # SwiftFormat: redundantParens
  - empty_enum_arguments             # SwiftFormat: redundantPattern
  - empty_parameters                 # SwiftFormat: void
  - empty_parentheses_with_trailing_closure  # SwiftFormat: trailingClosures
  - implicit_getter                  # SwiftFormat: redundantGet
  - implicit_optional_initialization # SwiftFormat: redundantNilInit
  - inclusive_language                # Not applicable to this project
  - leading_whitespace               # SwiftFormat: trailingSpace, indent
  - multiple_closures_with_trailing_closure  # SwiftFormat: trailingClosures
  - no_space_in_method_call          # SwiftFormat: spaceAroundParens
  - opening_brace                    # SwiftFormat: braces
  - protocol_property_accessors_order  # SwiftFormat: modifierOrder
  - redundant_discardable_let        # SwiftFormat: redundantLet
  - redundant_objc_attribute         # SwiftFormat: redundantObjc
  - redundant_set_access_control     # SwiftFormat: extensionAccessControl
  - redundant_string_enum_value      # SwiftFormat: redundantRawValues
  - redundant_void_return            # SwiftFormat: redundantVoidReturnType
  - return_arrow_whitespace          # SwiftFormat: spaceAroundOperators
  - shorthand_operator               # SwiftFormat: spaceAroundOperators
  - statement_position               # SwiftFormat: elseOnSameLine
  - switch_case_alignment            # SwiftFormat: indent
  - trailing_comma                   # SwiftFormat: trailingCommas
  - trailing_newline                 # SwiftFormat: linebreakAtEndOfFile
  - trailing_semicolon               # SwiftFormat: semicolons
  - trailing_whitespace              # SwiftFormat: trailingSpace
  - unused_optional_binding          # SwiftFormat: redundantOptionalBinding
  - vertical_parameter_alignment     # SwiftFormat: wrapArguments
  - vertical_whitespace              # SwiftFormat: consecutiveBlankLines
  - void_return                      # SwiftFormat: redundantVoidReturnType
  - empty_count                      # SwiftFormat: isEmpty

  # ── Rules conflicting with project conventions ──────────────────────────
  - identifier_name                  # Short names: 'db' in database closures, 'x'/'y' in layouts
  - type_name                        # 'typealias ID = UUID' pattern in models
  - nesting                          # TCA uses nested enums: Action { enum View, Delegate }
  - force_try                        # Intentional in #Preview and prepareDependencies
  - line_length                      # SwiftFormat handles wrapping at --maxwidth
  - todo                             # Allow TODO/FIXME during development
  - custom_rules                     # No custom regex rules needed yet

# ══════════════════════════════════════════════════════════════════════════════
# DEFAULT RULES — enabled (safety, lint, idiomatic, metrics, performance)
# Listed for visibility. These are on by default; no action needed.
# ══════════════════════════════════════════════════════════════════════════════

# Lint rules (bug detection, best practices)
# - blanket_disable_command          # Warn on blanket swiftlint:disable without rule name
# - block_based_kvo                  # Prefer block-based KVO
# - class_delegate_protocol          # Delegate protocols should be class-only
# - comment_spacing                  # Space after // in comments
# - compiler_protocol_init           # Don't call compiler protocol init directly
# - deployment_target                # Warn on availability checks below deployment target
# - discouraged_direct_init          # Warn on direct init of certain types (e.g. Bundle)
# - duplicate_conditions             # Warn on duplicate conditions in if/switch
# - duplicate_enum_cases             # Warn on duplicate enum cases
# - duplicated_key_in_dictionary_literal  # Warn on duplicate dictionary keys
# - dynamic_inline                   # @inline with dynamic is contradictory
# - invalid_swiftlint_command        # Warn on malformed swiftlint commands
# - mark                             # MARK comments must be formatted correctly
# - non_optional_string_data_conversion  # Use throwing String(data:encoding:)
# - notification_center_detachment   # Must remove observer from same object
# - ns_number_init_as_function_reference  # Don't use NSNumber.init as function ref
# - nsobject_prefer_isequal          # NSObject subclasses should override isEqual
# - optional_data_string_conversion  # Prefer throwing String init over optional
# - orphaned_doc_comment             # Doc comment not attached to declaration
# - private_unit_test                # Test methods should not be private
# - redundant_sendable               # Remove redundant Sendable conformances
# - self_in_property_initialization  # Warn on self in lazy property init
# - superfluous_disable_command      # Warn on unnecessary swiftlint:disable
# - unneeded_override                # Remove overrides that just call super
# - unused_closure_parameter         # Replace unused closure params with _
# - unused_control_flow_label        # Remove unused loop labels
# - unused_setter_value              # Warn on unused setter newValue
# - valid_ibinspectable              # @IBInspectable must have supported type

# Idiomatic rules (Swift idioms, modern API)
# - block_based_kvo                  # Use block-based KVO API
# - duplicate_imports                # Remove duplicate imports
# - for_where                        # Prefer for-where over for-if
# - force_cast                       # Avoid force casting (as!)
# - generic_type_name                # Generic type params should be descriptive
# - is_disjoint                      # Prefer isDisjoint(with:) over intersection
# - legacy_cggeometry_functions      # Use modern CGGeometry API
# - legacy_constant                  # Use modern constant syntax
# - legacy_constructor               # Use modern initializer syntax
# - legacy_hashing                   # Use Hashable protocol
# - legacy_nsgeometry_functions      # Use modern NSGeometry API
# - legacy_random                    # Use Swift random API
# - no_fallthrough_only              # Avoid fallthrough as only case body
# - prefer_type_checking             # Prefer is/as over type comparison
# - private_over_fileprivate         # Prefer private over fileprivate
# - static_over_final_class          # Prefer static over final class
# - syntactic_sugar                  # Use [T] over Array<T>
# - unavailable_condition            # Use #unavailable over !#available
# - unneeded_break_in_switch         # Remove unneeded break in switch
# - unneeded_synthesized_initializer # Remove redundant synthesized init
# - unused_enumerated                # Warn on unused enumerated index/value
# - void_function_in_ternary         # Don't use void functions in ternary
# - xctfail_message                  # XCTFail should have a message

# Metrics rules (complexity, length)
# - cyclomatic_complexity            # Warn on high cyclomatic complexity
# - file_length                      # Warn on long files (configured below)
# - function_body_length             # Warn on long functions (configured below)
# - function_parameter_count         # Warn on too many parameters
# - large_tuple                      # Warn on large tuples
# - type_body_length                 # Warn on long type bodies (configured below)

# Performance rules
# - reduce_boolean                   # Prefer allSatisfy/contains over reduce

# ══════════════════════════════════════════════════════════════════════════════
# OPT-IN RULES — enabled (safety and performance improvements)
# ══════════════════════════════════════════════════════════════════════════════
opt_in_rules:
  # Performance
  - contains_over_filter_count       # Prefer contains over filter.count > 0
  - contains_over_filter_is_empty    # Prefer contains over filter.isEmpty
  - contains_over_first_not_nil      # Prefer contains over first != nil
  - contains_over_range_nil_comparison  # Prefer contains over range != nil
  - empty_collection_literal         # Prefer isEmpty over == []
  - empty_string                     # Prefer isEmpty over == ""
  - first_where                      # Prefer first(where:) over filter.first
  - last_where                       # Prefer last(where:) over filter.last
  - sorted_first_last                # Prefer min/max over sorted.first/last
  - flatmap_over_map_reduce          # Prefer flatMap over map.reduce
  - reduce_into                      # Prefer reduce(into:) over reduce

  # Safety / lint
  - array_init                       # Prefer Array(seq) over seq.map { $0 }
  - discouraged_optional_boolean     # Avoid Bool? — ambiguous truthiness
  - discouraged_optional_collection  # Avoid optional collections — use empty instead
  - identical_operands               # Warn on comparing identical operands
  - overridden_super_call            # Must call super in overridden methods
  - unhandled_throwing_task          # Warn on unhandled errors in Task
  - local_doc_comment                # Warn on doc comments inside function body
  - lower_acl_than_parent            # Member ACL should not exceed parent
  - yoda_condition                   # Avoid Yoda conditions (5 == x)
  - period_spacing                   # Correct spacing around periods
  - private_swiftui_state            # @State should be private

  # Idiomatic
  - toggle_bool                      # Prefer .toggle() over x = !x
  - redundant_nil_coalescing         # Remove x ?? nil
  # redundant_type_annotation          # Disabled: @Table structs use explicit types for documentation
  - shorthand_optional_binding       # Prefer if let x over if let x = x

